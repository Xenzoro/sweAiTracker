name: Daily collection

on:
  schedule:
    - cron: '23 14 * * *'   # 14:23 UTC = 7:23am Pacific (6:23am after Nov 2)
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one step (bls), or leave as all'
        type: choice
        options: [all, bls]
        default: all

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Collect
        id: collect
        run: |
          # GitHub often starts scheduled runs hours late; if today was already collected
          # (for example by a manual run), skip so today's new/closed counts are not overwritten.
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "^$(TZ=America/Los_Angeles date +%F),.*actions v2.*boards=ok" data/run_log.csv; then
            echo "today already collected; skipping scheduled run"; exit 0
          fi
          if [ "${{ inputs.only }}" = "bls" ]; then python scripts/run_daily.py --only bls; else python scripts/run_daily.py; fi
        continue-on-error: true
      - name: Commit and push
        run: |
          git config user.name "sweAiTracker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily collection $(TZ=America/Los_Angeles date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
      - name: Fail if a collector failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
